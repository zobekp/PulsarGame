<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>PULSAR.io</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- Data layer: load BEFORE any engine code. These attach to window.PULSAR. -->
<!-- No build step — plain script tags, in dependency order (config first). -->
<script src="data/config.js"></script>
<script src="data/classes.js"></script>
<script src="data/farming.js"></script>
<script src="data/visuals.js"></script>

<!-- Engine. Load after data; game.js is the entry point. -->
<script src="src/input.js"></script>
<script src="src/render.js"></script>
<script src="src/fx.js"></script>
<script src="src/weapons.js"></script>
<script src="src/game.js"></script>
</body>
</html>
