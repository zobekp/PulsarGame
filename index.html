<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>PULSAR.io</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; }

  /* ---- title screen ---- */
  #title { position: fixed; inset: 0; z-index: 500; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 17px;
    background: radial-gradient(ellipse at 50% 35%, rgba(18,45,78,0.30), rgba(4,6,12,0.95) 72%);
    backdrop-filter: blur(3px); }
  #title::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.28;
    background: linear-gradient(rgba(90,160,220,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(90,160,220,.045) 1px, transparent 1px);
    background-size: 72px 72px; mask-image: radial-gradient(circle at center, black, transparent 78%); }
  #title > * { position: relative; }
  #title .logo { font-weight: 850; font-size: clamp(54px, 10vw, 116px); letter-spacing: -4px; line-height: 0.9;
    color: #eaf6ff; position: relative; animation: pulse 3.2s ease-in-out infinite;
    text-shadow: 0 0 14px #39d0ff, 0 0 40px rgba(57,208,255,0.8), 0 0 90px rgba(57,208,255,0.45); }
  #title .logo span { color: #7be0ff; font-weight: 300; text-shadow: 0 0 16px rgba(123,224,255,0.9); }
  #title .tag { color: rgba(180,210,240,0.68); font-size: 12px; letter-spacing: 6px; text-transform: uppercase; margin-top: -5px; }
  #title .row { display: flex; gap: 9px; padding: 7px; border: 1px solid rgba(105,180,230,.2); border-radius: 12px;
    background: rgba(7,13,24,.72); box-shadow: 0 18px 60px rgba(0,0,0,.35); }
  #title input { width: 240px; padding: 13px 16px; font-size: 16px; color: #eaf6ff; outline: none;
    background: rgba(20,32,52,0.7); border: 1.5px solid rgba(120,224,255,0.5); border-radius: 8px; }
  #title input::placeholder { color: rgba(150,180,210,0.5); }
  #title input:focus { border-color: #39d0ff; box-shadow: 0 0 0 3px rgba(57,208,255,0.18); }
  #title button { padding: 13px 26px; font-size: 14px; letter-spacing: 1px; font-weight: 800; color: #04121c; cursor: pointer;
    background: linear-gradient(180deg, #8fe9ff, #39d0ff); border: none; border-radius: 8px;
    box-shadow: 0 0 22px rgba(57,208,255,0.6); transition: transform .08s, box-shadow .2s; }
  #title button:hover { transform: translateY(-1px); box-shadow: 0 0 34px rgba(57,208,255,0.9); }
  #title .hint { color: rgba(150,180,210,0.55); font-size: 12px; letter-spacing: 1px; margin-top: 6px; }
  @keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.25); } }
  /* ---- cosmetics hangar (live hull previews; tier-colored cards) ---- */
  #shop { display: flex; flex-direction: column; align-items: center; gap: 9px; margin-top: 1px; padding: 11px 13px 13px;
    background: rgba(7,12,22,.62); border: 1px solid rgba(90,145,195,.18); border-radius: 12px; }
  #shop .cores { color: #8fe9ff; font-size: 11px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(143,233,255,0.5); }
  #skins { display: grid; grid-template-columns: repeat(5, 118px); gap: 8px; justify-content: center; }
  @media (max-width: 700px) { #skins { grid-template-columns: repeat(3, 118px); } }
  #title .skin { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 5px 6px; cursor: pointer;
    background: rgba(11,19,32,0.92); border: 1px solid rgba(80,110,150,0.32); border-radius: 9px; color: rgba(190,210,230,0.8);
    font-size: 11px; letter-spacing: 0; box-shadow: none; transition: border-color .15s, transform .08s; }
  #title .skin:hover { transform: translateY(-2px); border-color: var(--tier); box-shadow: 0 8px 20px rgba(0,0,0,.3); }
  .skin canvas.pv { width: 100px; height: 54px; border-radius: 6px;
    background: radial-gradient(ellipse at 50% 45%, rgba(24,42,66,0.55), rgba(5,8,14,0.9)); }
  .skin.locked canvas.pv { filter: grayscale(.55) brightness(.6); }
  .skin .nm { font-weight: 650; white-space: nowrap; }
  .skin .tr { font-size: 8.5px; letter-spacing: 2px; color: var(--tier); font-weight: 800; }
  .skin .st { font-size: 10px; color: rgba(150,180,210,0.7); }
  .skin.owned .st { color: #7be0ff; }
  #title .skin.eq { background: rgba(18,31,48,.96); border-color: var(--tier);
    box-shadow: 0 0 16px rgba(57,208,255,0.22), inset 0 0 16px rgba(90,180,230,.06); }
  .skin.eq .st { color: #eaf6ff; font-weight: 700; }
  .skin.deny { animation: deny .32s; }
  @keyframes deny { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- Title / name entry. Shown until PLAY; game runs (idle, invulnerable) behind it. -->
<div id="title">
  <div class="logo">PULSAR<span>.io</span></div>
  <div class="tag">evolve · contest the pulsar · dominate</div>
  <div class="row">
    <input id="pname" maxlength="16" placeholder="enter a name" autocomplete="off" spellcheck="false" />
    <button id="playbtn">PLAY ▸</button>
  </div>
  <div id="shop">
    <div class="cores">◆ <span id="corebal">0</span> CORES · <span style="opacity:.6">skins are cosmetic only</span></div>
    <div id="skins"></div>
  </div>
  <div class="hint">WASD move · mouse aim · hold to fire · Space ability · E special</div>
</div>

<!-- DEBUG: surface any uncaught error on-screen (so crashes are self-reporting). Remove before ship. -->
<div id="errbox" style="display:none;position:fixed;left:0;right:0;top:0;z-index:9999;
  background:rgba(40,0,0,0.92);color:#ffd0d0;font:12px/1.5 monospace;padding:10px 14px;
  white-space:pre-wrap;border-bottom:2px solid #ff5b5b;max-height:60%;overflow:auto;"></div>
<script>
  (function () {
    function show(label, msg) {
      var b = document.getElementById('errbox');
      b.style.display = 'block';
      b.textContent = '⚠ ' + label + '\n' + msg + '\n\n(stop the game; tell Claude this text)';
    }
    addEventListener('error', function (e) {
      var loc = e.filename ? (e.filename.split('/').pop() + ':' + e.lineno + ':' + e.colno) : '';
      show(e.message + '  @ ' + loc, (e.error && e.error.stack) ? e.error.stack : '(no stack)');
    });
    addEventListener('unhandledrejection', function (e) {
      show('Unhandled promise rejection', (e.reason && e.reason.stack) || String(e.reason));
    });
  })();
</script>

<!-- Data layer: load BEFORE any engine code. These attach to window.PULSAR. -->
<!-- No build step — plain script tags, in dependency order (config first). -->
<script src="data/config.js"></script>
<script src="data/classes.js"></script>
<script src="data/farming.js"></script>
<script src="data/visuals.js"></script>
<script src="data/cosmetics.js"></script>

<!-- Engine. Load after data; game.js is the entry point. -->
<script src="src/input.js"></script>
<script src="src/render.js"></script>
<script src="src/fx.js"></script>
<script src="src/profile.js"></script>
<script src="src/weapons.js"></script>
<script src="src/ships.js"></script>
<script src="src/mpclient.js"></script>
<script src="src/bots.js"></script>
<!-- sim.js IS the game logic (PULSAR.createWorld) — the same file runs headless on the
     authoritative server. Loads after weapons/bots (reads weaponHue at load). -->
<script src="src/sim.js"></script>
<script src="src/game.js"></script>

<!-- Title screen wiring (runs after game.js so PULSAR.startGame exists). -->
<script>
  (function () {
    var t = document.getElementById('title'), inp = document.getElementById('pname'), btn = document.getElementById('playbtn');
    var P = window.PULSAR && PULSAR.Profile, C = window.PULSAR && PULSAR.cosmetics;
    if (P) inp.value = P.get().name || '';

    // ---- hangar: live hull previews (the real procedural renderer, skinned) ----
    var previews = [];                       // repainted every frame while the title is up
    var PV_W = 100, PV_H = 54;
    function paintPreview(pv, time) {
      var ctx = pv.ctx;
      ctx.clearRect(0, 0, PV_W, PV_H);
      ctx.save();
      ctx.translate(PV_W * 0.52, PV_H * 0.56);
      ctx.rotate(-0.38);
      // A minimal ship stub with every field the hull models read; vx>0 lights the engines.
      var s = { classId: 'railship', radius: 12.5, skin: pv.id, vx: 170, vy: 0, aim: 0, alive: true,
                charge: 0, charging: false, chargeFullTimer: 0, heat: 0, ventTimer: 0, hitFlash: 0,
                captured: [], level: 1, id: 0 };
      try { PULSAR.Ships.draw(ctx, s, time); }
      catch (e) { ctx.restore(); ctx.fillStyle = pv.accent; ctx.beginPath(); ctx.arc(PV_W / 2, PV_H / 2, 10, 0, 6.2832); ctx.fill(); return; }
      ctx.restore();
    }
    function paintAll(ts) {
      if (t.style.display === 'none') return;              // title closed → stop the loop
      for (var i = 0; i < previews.length; i++) paintPreview(previews[i], ts / 1000);
      requestAnimationFrame(paintAll);
    }

    function renderShop() {
      if (!P || !C) return;
      document.getElementById('corebal').textContent = P.get().cores;
      var wrap = document.getElementById('skins'); wrap.innerHTML = '';
      previews = [];
      C.skins.forEach(function (sk) {
        var owned = P.isUnlocked(sk.id), equipped = P.get().skin === sk.id;
        var tier = (C.tiers && C.tiers[sk.tier]) || { name: '', color: '#9fb3c8' };
        var b = document.createElement('button');
        b.className = 'skin' + (equipped ? ' eq' : '') + (owned ? ' owned' : ' locked');
        b.style.setProperty('--tier', tier.color);
        b.title = sk.blurb || '';
        var cv = document.createElement('canvas');
        cv.className = 'pv';
        var dpr = window.devicePixelRatio || 1;
        cv.width = PV_W * dpr; cv.height = PV_H * dpr;
        var cctx = cv.getContext('2d'); cctx.scale(dpr, dpr);
        b.appendChild(cv);
        previews.push({ ctx: cctx, id: sk.id, accent: sk.accent });
        b.insertAdjacentHTML('beforeend',
          '<span class="nm">' + sk.name + '</span>' +
          '<span class="tr">' + tier.name.toUpperCase() + '</span>' +
          '<span class="st">' + (equipped ? 'EQUIPPED' : owned ? 'equip' : '◆ ' + sk.cost) + '</span>');
        b.addEventListener('click', function () {
          if (owned) P.equip(sk.id);
          else if (!P.unlock(sk.id, sk.cost)) {            // can't afford: shake, keep state
            b.classList.add('deny'); setTimeout(function () { b.classList.remove('deny'); }, 340);
            return;
          } else P.equip(sk.id);
          renderShop();
        });
        wrap.appendChild(b);
      });
    }
    renderShop();
    requestAnimationFrame(paintAll);

    function go() {
      var n = (inp.value || '').trim();
      if (P) P.setName(n);
      if (window.PULSAR && PULSAR.startGame) PULSAR.startGame(n);
      t.style.display = 'none';
    }
    btn.addEventListener('click', go);
    // Keep keystrokes in the name box out of the game's input handler (so Space etc. type normally).
    inp.addEventListener('keydown', function (e) { e.stopPropagation(); if (e.key === 'Enter') go(); });
    setTimeout(function () { inp.focus(); }, 80);
    // ?tree — dev/screenshot hook: skip the title and open the class tree overlay immediately.
    if (/\btree\b/.test(location.search)) go();
  })();
</script>
</body>
</html>
